<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThreadLearn — Race Condition Analyzer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap');

  :root {
    --ground:     #0a0a0f;
    --surface:    #111118;
    --surface-2:  #17171f;
    --border:     rgba(255,255,255,0.07);
    --border-hi:  rgba(124,106,247,0.4);
    --text:       #e8e8f0;
    --text-dim:   #6b6b8a;
    --text-mid:   #9999b8;
    --accent:     #7c6af7;
    --accent-glow:rgba(124,106,247,0.15);
    --high:       #f05a7e;
    --high-bg:    rgba(240,90,126,0.08);
    --high-border:rgba(240,90,126,0.25);
    --med:        #f0a050;
    --med-bg:     rgba(240,160,80,0.08);
    --med-border: rgba(240,160,80,0.25);
    --low:        #50d0a0;
    --low-bg:     rgba(80,208,160,0.08);
    --low-border: rgba(80,208,160,0.25);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--ground);
    color: var(--text);
    
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a40; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* ── LAYOUT ─────────────────────────────────────────── */
  .app {
    display: grid;
    grid-template-rows: 48px 1fr 200px;
    height: 100vh;
    overflow: hidden;
  }

  /* ── TOPBAR ─────────────────────────────────────────── */
  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-mid);
    white-space: nowrap;
  }
  .logo-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  .sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }

  .mode-tabs { display: flex; gap: 4px; }
  .mode-tab {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 5px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.06em;
    transition: all 0.15s;
  }
  .mode-tab.active {
    background: var(--accent-glow);
    border-color: var(--border-hi);
    color: var(--accent);
  }
  .mode-tab:hover:not(.active) { color: var(--text-mid); background: rgba(255,255,255,0.03); }

  .case-label { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  .case-select {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 5px 9px;
    border-radius: 5px;
    outline: none;
    cursor: pointer;
    max-width: 260px;
    transition: border-color 0.15s;
  }
  .case-select:focus { border-color: var(--border-hi); }

  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  .ai2-indicator {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--text-dim);
  }
  .ai2-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .ai2-dot.online  { background: var(--low);  box-shadow: 0 0 6px var(--low); }
  .ai2-dot.offline { background: var(--high); box-shadow: 0 0 6px var(--high); }

  .btn-analyze {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--accent); color: #fff;
    border: none; border-radius: 6px;
    padding: 6px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
    cursor: pointer;
    transition: opacity 0.15s, box-shadow 0.15s;
  }
  .btn-analyze:hover { opacity: 0.85; box-shadow: 0 0 16px var(--accent-glow); }
  .btn-analyze:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── MAIN SPLIT ─────────────────────────────────────── */
  .main {
    display: grid;
    grid-template-columns: 1fr 340px;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }

  /* ── EDITOR PANE ────────────────────────────────────── */
  .editor-pane { display: flex; flex-direction: column; border-right: 1px solid var(--border); overflow: hidden; }

  .pane-header {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface); flex-shrink: 0;
  }
  .pane-title { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); }
  .lang-badge {
    font-size: 10px; padding: 2px 7px; border-radius: 4px;
    background: rgba(124,106,247,0.1); color: var(--accent);
    border: 1px solid rgba(124,106,247,0.2); letter-spacing: 0.06em;
  }

  .editor-scroll { flex: 1; overflow: auto; position: relative; }
  .editor-inner { display: flex; min-height: 100%; }

  .line-numbers {
    flex-shrink: 0; width: 44px; padding: 14px 0;
    background: var(--surface); border-right: 1px solid var(--border);
    user-select: none;
  }
  .line-num {
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 10px; height: 21px;
    font-size: 11px; color: var(--text-dim);
    position: relative; transition: color 0.1s;
  }
  .line-num.hl-h { color: var(--high); }
  .line-num.hl-m { color: var(--med);  }
  .line-num.hl-l { color: var(--low);  }

  .gutter-dot {
    position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
    width: 5px; height: 5px; border-radius: 50%;
  }
  .gutter-dot.h { background: var(--high); box-shadow: 0 0 5px var(--high); }
  .gutter-dot.m { background: var(--med);  box-shadow: 0 0 5px var(--med); }
  .gutter-dot.l { background: var(--low);  box-shadow: 0 0 5px var(--low); }

  .code-area {
    flex: 1; padding: 14px 16px 14px 10px;
    white-space: pre; font-size: 13px; line-height: 21px;
    color: var(--text); outline: none; caret-color: var(--accent);
    overflow-x: auto;
  }
  /* editable mode */
  .code-area[contenteditable="true"] { cursor: text; }

  .code-line { display: block; height: 21px; position: relative; }
  .code-line.hl-high { background: var(--high-bg); border-left: 2px solid var(--high); padding-left: 6px; margin-left: -2px; }
  .code-line.hl-med  { background: var(--med-bg);  border-left: 2px solid var(--med);  padding-left: 6px; margin-left: -2px; }
  .code-line.hl-low  { background: var(--low-bg);  border-left: 2px solid var(--low);  padding-left: 6px; margin-left: -2px; }

  /* syntax */
  .kw  { color: #c792ea; }
  .fn  { color: #82aaff; }
  .str { color: #c3e88d; }
  .num { color: #f78c6c; }
  .cmt { color: #546e7a; font-style: italic; }
  .prop{ color: #ffcb6b; }

  /* loading overlay */
  .loading-overlay {
    position: absolute; inset: 0;
    background: rgba(10,10,15,0.75);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    z-index: 10; backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .loading-overlay.visible { opacity: 1; pointer-events: all; }

  .spinner {
    width: 28px; height: 28px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 12px; color: var(--text-mid); letter-spacing: 0.06em; }

  /* ── ISSUES PANE ────────────────────────────────────── */
  .issues-pane { display: flex; flex-direction: column; overflow: hidden; background: var(--surface); }
  .issues-scroll { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }

  .count-badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; border-radius: 9px;
    font-size: 10px; font-weight: 700; padding: 0 5px;
  }
  .count-badge.has  { background: var(--high-bg); color: var(--high); border: 1px solid var(--high-border); }
  .count-badge.none { background: rgba(80,208,160,0.1); color: var(--low); border: 1px solid rgba(80,208,160,0.2); }

  .issue-card {
    border-radius: 7px; padding: 10px 12px; border: 1px solid;
    cursor: default; position: relative; overflow: hidden;
    transition: transform 0.12s;
  }
  .issue-card:hover { transform: translateX(2px); }
  .issue-card.high { background: var(--high-bg); border-color: var(--high-border); }
  .issue-card.medium { background: var(--med-bg); border-color: var(--med-border); }
  .issue-card.low  { background: var(--low-bg);  border-color: var(--low-border); }

  .issue-top { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
  .sev-pill {
    font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
    padding: 2px 7px; border-radius: 3px; text-transform: uppercase;
  }
  .sev-pill.high   { background: rgba(240,90,126,0.2); color: var(--high); }
  .sev-pill.medium { background: rgba(240,160,80,0.2); color: var(--med); }
  .sev-pill.low    { background: rgba(80,208,160,0.2); color: var(--low); }

  .issue-line { font-size: 10px; color: var(--text-dim); margin-left: auto; }
  .issue-pattern { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
  .issue-desc { font-size: 11px; color: var(--text-mid); line-height: 1.5; margin-bottom: 7px; }
  .issue-fix-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 3px; }
  .issue-fix {
    font-size: 11px; color: var(--text-mid);
    background: rgba(0,0,0,0.3); border-radius: 5px;
    padding: 6px 9px; border: 1px solid var(--border);
    white-space: pre-wrap; line-height: 1.5;
  }

  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; flex: 1; gap: 8px;
    text-align: center; padding: 32px 16px; color: var(--text-dim);
  }
  .empty-icon { font-size: 24px; opacity: 0.3; }
  .empty-text { font-size: 11px; line-height: 1.6; }

  /* error banner */
  .error-banner {
    margin: 10px; padding: 10px 12px; border-radius: 7px;
    background: var(--high-bg); border: 1px solid var(--high-border);
    font-size: 11px; color: var(--high); line-height: 1.5;
    display: none;
  }
  .error-banner.visible { display: block; }

  /* ── EXPLAIN PANE ────────────────────────────────────── */
  .explain-pane { display: flex; flex-direction: column; overflow: hidden; background: var(--surface); }
  .explain-scroll { flex: 1; overflow-y: auto; padding: 11px 16px; }

  .explain-label {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-dim); display: flex; align-items: center; gap: 7px;
    margin-bottom: 7px;
  }
  .rag-tag {
    font-size: 9px; padding: 2px 6px; border-radius: 3px;
    background: rgba(124,106,247,0.1); color: var(--accent);
    border: 1px solid rgba(124,106,247,0.2); letter-spacing: 0.06em;
  }
  .mode-tag {
    font-size: 9px; padding: 2px 6px; border-radius: 3px;
    border: 1px solid; letter-spacing: 0.06em;
  }
  .mode-tag.live  { background: rgba(80,208,160,0.1); color: var(--low); border-color: rgba(80,208,160,0.2); }
  .mode-tag.mock  { background: rgba(240,160,80,0.1); color: var(--med); border-color: rgba(240,160,80,0.2); }

  .explain-text { font-size: 12px; color: var(--text-mid); line-height: 1.7; }
  .explain-text strong { color: var(--text); font-weight: 600; }

  .docs-used { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
  .doc-chip {
    font-size: 10px; padding: 3px 9px; border-radius: 4px;
    background: rgba(124,106,247,0.07); color: var(--accent);
    border: 1px solid rgba(124,106,247,0.15);
  }

  /* cached badge */
  .cached-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; padding: 2px 8px; border-radius: 4px;
    background: rgba(124,106,247,0.08); color: var(--accent);
    border: 1px solid rgba(124,106,247,0.15);
    margin-left: auto;
  }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; }
    .issue-card { transition: none; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="logo">
      <div class="logo-dot"></div>
      ThreadLearn
    </div>
    <div class="sep"></div>

    <!-- Mode: mock vs live -->
    <div class="mode-tabs">
      <button class="mode-tab active" id="tabMock" onclick="setMode('mock')">Mock</button>
      <button class="mode-tab" id="tabLive" onclick="setMode('live')">Live AI2</button>
    </div>
    <div class="sep"></div>

    <!-- Case selector (mock mode only) -->
    <span class="case-label" id="caseLabelEl">Test case:</span>
    <select class="case-select" id="caseSelect" onchange="loadCase(this.value)">
      <option value="0">closure_loop_var — for+var+setTimeout</option>
      <option value="1">double_callback — mysql query pattern</option>
      <option value="2">unhandled_rejection — async route no catch</option>
      <option value="3">sequential_awaits — dashboard 3 awaits</option>
      <option value="4">context_loss_this — class method + express</option>
    </select>

    <div class="topbar-right">
      <div class="ai2-indicator">
        <div class="ai2-dot" id="ai2Dot"></div>
        <span id="ai2Label">checking…</span>
      </div>
      <div class="sep"></div>
      <button class="btn-analyze" id="analyzeBtn" onclick="runAnalysis()">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M2 2l8 4-8 4V2z" fill="currentColor"/>
        </svg>
        Analyze
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <div class="main">

    <!-- Editor -->
    <div class="editor-pane">
      <div class="pane-header">
        <span class="pane-title">Editor</span>
        <span class="lang-badge">JavaScript</span>
        <span id="cachedBadge" class="cached-badge" style="display:none;">
          ⚡ cached
        </span>
      </div>
      <div class="editor-scroll" id="editorScroll" style="position:relative;">
        <div class="editor-inner">
          <div class="line-numbers" id="lineNumbers"></div>
          <div class="code-area" id="codeArea" contenteditable="true"
               spellcheck="false" autocorrect="off" autocapitalize="off"
               oninput="onCodeEdit()"></div>
        </div>
        <div class="loading-overlay" id="loadingOverlay">
          <div class="spinner"></div>
          <div class="loading-text" id="loadingText">Analyzing concurrency patterns…</div>
        </div>
      </div>
    </div>

    <!-- Issues -->
    <div class="issues-pane">
      <div class="pane-header">
        <span class="pane-title">Issues</span>
        <span class="count-badge none" id="issueCount">0</span>
      </div>
      <div class="error-banner" id="errorBanner"></div>
      <div class="issues-scroll" id="issuesList">
        <div class="empty-state">
          <div class="empty-icon">⏳</div>
          <div class="empty-text">Click <strong>Analyze</strong> to detect<br>concurrency bugs.</div>
        </div>
      </div>
    </div>

  </div>

  <!-- EXPLAIN -->
  <div class="explain-pane">
    <div class="explain-scroll">
      <div class="explain-label">
        AI Explanation
        <span class="rag-tag">RAG</span>
        <span class="mode-tag mock" id="modeTag">mock</span>
      </div>
      <div class="explain-text" id="explainText" style="color:var(--text-dim);font-style:italic;">
        Run analysis to see explanation and knowledge-base references.
      </div>
      <div class="docs-used" id="docsUsed"></div>
    </div>
  </div>

</div>

<script>
// ─── CONFIG ────────────────────────────────────────────────────────────────
const BACKEND_URL = "http://localhost:3001";

// ─── MOCK DATA ─────────────────────────────────────────────────────────────
const MOCK_CASES = [
  {
    title: "closure_loop_var",
    code: `// Bug: for-loop với var + setTimeout callback
// Source: classic JS closure pitfall

function scheduleNotifications(users) {
  for (var i = 0; i < users.length; i++) {
    setTimeout(function() {
      console.log("Sending to user:", users[i]);
      sendEmail(users[i].email, "Hello!");
    }, i * 100);
  }
}

// users[i] lúc callback chạy: i = users.length
// Tất cả callback nhận cùng giá trị i cuối cùng`,
    mock_response: {
      issues: [
        {
          severity: "high",
          pattern_id: "closure_loop_var",
          line_range: "5-9",
          description: "Biến var i được share qua tất cả setTimeout callbacks. Khi callback chạy, i đã = users.length.",
          fix: "Thay var → let:\nfor (let i = 0; i < users.length; i++) { ... }",
          hl_lines: [5,6,7,8,9], hl_cls: "hl-high"
        }
      ],
      docs_used: [
        { id: "d001", title: "Closure Loop Variable", category: "race-condition" },
        { id: "d012", title: "var vs let Scope", category: "fundamentals" },
        { id: "d018", title: "Event Loop Timing", category: "async" }
      ],
      explanation: "Đây là <strong>Closure Loop Variable</strong> — bug JS cổ điển. Khi dùng <strong>var</strong>, biến i tồn tại trong scope hàm, không phải từng iteration. Tất cả callbacks giữ reference đến cùng biến i. Khi event loop chạy callbacks, i đã = users.length.\n\nFix: dùng <strong>let</strong> — tạo binding riêng mỗi iteration."
    }
  },
  {
    title: "double_callback",
    code: `// Bug: double callback — mysql pattern
// Source: github.com/mysqljs/mysql/issues/1260

function queryUser(userId, callback) {
  connection.connect(function(err) {
    if (err) callback(err);  // thiếu return!

    connection.query(
      "SELECT * FROM users WHERE id = ?",
      [userId],
      function(err, results) {
        callback(err, results);  // callback gọi lần 2!
      }
    );
  });
}`,
    mock_response: {
      issues: [
        {
          severity: "high",
          pattern_id: "double_callback",
          line_range: "5-6",
          description: "Thiếu return trước callback(err). Khi lỗi, callback gọi lần 1, nhưng hàm tiếp tục chạy.",
          fix: "Thêm return:\nif (err) return callback(err);",
          hl_lines: [5,6], hl_cls: "hl-high"
        },
        {
          severity: "medium",
          pattern_id: "double_callback",
          line_range: "8-13",
          description: "Query vẫn chạy dù callback đã được gọi với lỗi.",
          fix: "Cấu trúc lại với early return ở mọi error path.",
          hl_lines: [8,9,10,11,12,13], hl_cls: "hl-med"
        }
      ],
      docs_used: [
        { id: "d005", title: "Double Callback Pattern", category: "callback" },
        { id: "d019", title: "Error-First Callbacks", category: "callback" },
        { id: "d021", title: "Early Return Pattern", category: "patterns" }
      ],
      explanation: "Pattern <strong>Double Callback</strong> xảy ra khi thiếu <strong>return</strong> trong error path. Node.js convention: callback chỉ gọi <em>đúng một lần</em>. Khi callback bị gọi 2 lần, app có thể crash hoặc corrupt state.\n\nFix: <strong>return callback(err)</strong> để dừng execution ngay."
    }
  },
  {
    title: "unhandled_rejection",
    code: `// Bug: async route handler không có try/catch
// Source: github.com/expressjs/express/issues/2700

const express = require('express');
const app = express();

app.get('/user/:id', async function(req, res) {
  const user = await db.findUser(req.params.id);
  res.json(user);
});

app.get('/orders/:userId', async function(req, res) {
  const orders = await db.getOrders(req.params.userId);
  const totals = await paymentService.getTotals(orders);
  res.json({ orders, totals });
});`,
    mock_response: {
      issues: [
        {
          severity: "high",
          pattern_id: "unhandled_rejection",
          line_range: "7-9",
          description: "Async handler không có try/catch. db.findUser() throw → UnhandledPromiseRejection → server treo.",
          fix: "try {\n  const user = await db.findUser(req.params.id);\n  res.json(user);\n} catch (err) { next(err); }",
          hl_lines: [7,8,9], hl_cls: "hl-high"
        },
        {
          severity: "high",
          pattern_id: "unhandled_rejection",
          line_range: "12-15",
          description: "Route thứ hai có 2 await không được bảo vệ. Bất kỳ await nào fail dẫn đến unhandled rejection.",
          fix: "Dùng express-async-errors package hoặc wrap mọi async handler.",
          hl_lines: [12,13,14,15], hl_cls: "hl-high"
        }
      ],
      docs_used: [
        { id: "d007", title: "Express Error Handling", category: "express" },
        { id: "d022", title: "Unhandled Promise Rejection", category: "async" },
        { id: "d031", title: "Async Middleware Pattern", category: "express" }
      ],
      explanation: "Express 4 không tự catch async errors. Khi async handler throw, Express không nhận error — thành <strong>UnhandledPromiseRejection</strong>.\n\nFix: wrap bằng try/catch + next(err), hoặc dùng package <strong>express-async-errors</strong>, hoặc upgrade lên Express 5."
    }
  },
  {
    title: "sequential_awaits",
    code: `// Bug: sequential awaits — performance anti-pattern
// Source: nodebestpractices

async function getDashboard(userId) {

  const orders        = await db.orders.findByUser(userId);
  const notifications = await db.notifications.findByUser(userId);

    mock_response: {

          fix: "const [user, orders, notifications] = await Promise.all([\n  db.users.findById(userId),\n  db.orders.findByUser(userId),\n  db.notifications.findByUser(userId)\n]);",

        }
      ],
      docs_used: [
        { id: "d009", title: "Promise.all Concurrency", category: "async" },
        { id: "d033", title: "Sequential vs Parallel Async", category: "performance" },
        { id: "d041", title: "Dashboard Query Patterns", category: "patterns" }
      ],
      explanation: "Pattern <strong>Sequential Awaits</strong> không crash nhưng là performance anti-pattern. Khi Promises không phụ thuộc nhau, dùng await tuần tự lãng phí thời gian.\n\n<strong>Promise.all()</strong> chạy concurrently: latency = max(t1,t2,t3) thay vì t1+t2+t3. Dashboard 3 queries ~120ms mỗi cái: 360ms → 120ms."
    }
  },
  {
    title: "context_loss_this",
    code: `// Bug: mất this khi truyền class method vào Express
// Source: express-async-errors/issues/3

class UserController {
  constructor() {

  }

  async getUser(req, res) {
    // this.db = undefined khi Express gọi!

    const user = await this.db.findById(req.params.id);
    res.json(user);

    mock_response: {

          fix: "app.get('/user/:id', ctrl.getUser.bind(ctrl));\n// hoặc arrow:\napp.get('/user/:id', (req,res) => ctrl.getUser(req,res));",

        },
        {

// ─── STATE ──────────────────────────────────────────────────────────────────
let mode = "mock";           // "mock" | "live"
let currentCaseIdx = 0;
let currentHighlights = [];  // [{hl_lines, hl_cls}]

// ─── MODE ───────────────────────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.getElementById("tabMock").classList.toggle("active", m === "mock");
  document.getElementById("tabLive").classList.toggle("active", m === "live");

  const modeTag = document.getElementById("modeTag");
  modeTag.textContent = m;
  modeTag.className = `mode-tag ${m}`;

  const caseSelectWrap = document.getElementById("caseSelect");
  const caseLabelEl = document.getElementById("caseLabelEl");
  caseSelectWrap.style.display = m === "mock" ? "" : "none";
  caseLabelEl.style.display    = m === "mock" ? "" : "none";

  const codeArea = document.getElementById("codeArea");
  if (m === "live") {
    codeArea.setAttribute("contenteditable", "true");
    codeArea.innerHTML = "";
    setPlainText(codeArea, "// Paste your JavaScript code here\n// then click Analyze\n");
    resetIssues();
    resetExplain();
  } else {
    loadCase(currentCaseIdx);
  }
}

// ─── HEALTH CHECK ────────────────────────────────────────────────────────────
async function checkHealth() {
  const dot   = document.getElementById("ai2Dot");
  const label = document.getElementById("ai2Label");
  try {
    const r = await fetch(`${BACKEND_URL}/health`, { signal: AbortSignal.timeout(3000) });
    const d = await r.json();
    if (d.ai2_server === "ok") {
      dot.className = "ai2-dot online";
      label.textContent = `AI2 online · ${d.retriever_docs} docs`;
    } else {
      dot.className = "ai2-dot offline";
      label.textContent = "AI2 degraded";
    }
  } catch {
    dot.className = "ai2-dot offline";
    label.textContent = "AI2 offline";
  }
}

// ─── LOAD CASE (mock) ────────────────────────────────────────────────────────
function loadCase(idx) {
  currentCaseIdx = parseInt(idx);
  const c = MOCK_CASES[currentCaseIdx];
  currentHighlights = [];
  renderCodePlain(c.code);
  resetIssues();
  resetExplain();
  document.getElementById("cachedBadge").style.display = "none";
}

// ─── RENDER CODE ─────────────────────────────────────────────────────────────
function renderCodePlain(code) {
  const lines = code.split("\n");
  const codeArea = document.getElementById("codeArea");
  const lineNumbers = document.getElementById("lineNumbers");

  codeArea.innerHTML = lines.map(line =>
    `<span class="code-line">${syntaxHL(line) || " "}</span>`
  ).join("\n");

  lineNumbers.innerHTML = lines.map((_, i) =>
    `<div class="line-num">${i + 1}</div>`
  ).join("");
}

function renderCodeWithHL(code, highlights) {
  const lines = code.split("\n");
  const codeArea = document.getElementById("codeArea");
  const lineNumbers = document.getElementById("lineNumbers");

  // Build line → class map
  const hlMap = {};
  highlights.forEach(h => {
    h.hl_lines.forEach(ln => { hlMap[ln] = h.hl_cls; });
  });

  codeArea.innerHTML = lines.map((line, i) => {
    const ln = i + 1;
    const cls = hlMap[ln] || "";
    return `<span class="code-line ${cls}">${syntaxHL(line) || " "}</span>`;
  }).join("\n");

  lineNumbers.innerHTML = lines.map((_, i) => {
    const ln = i + 1;
    const cls = hlMap[ln];
    const dotCls = cls === "hl-high" ? "h" : cls === "hl-med" ? "m" : cls === "hl-low" ? "l" : "";
    const numCls = cls === "hl-high" ? "hl-h" : cls === "hl-med" ? "hl-m" : cls === "hl-low" ? "hl-l" : "";
    const dot = dotCls ? `<span class="gutter-dot ${dotCls}"></span>` : "";
    return `<div class="line-num ${numCls}">${dot}${ln}</div>`;
  }).join("");
}

function setPlainText(el, text) {
  const lines = text.split("\n");
  el.innerHTML = lines.map(line =>
    `<span class="code-line">${syntaxHL(line) || " "}</span>`
  ).join("\n");
  document.getElementById("lineNumbers").innerHTML =
    lines.map((_, i) => `<div class="line-num">${i + 1}</div>`).join("");
}

function getCurrentCode() {
  const codeArea = document.getElementById("codeArea");
  return codeArea.innerText || codeArea.textContent || "";
}

function onCodeEdit() {
  // Sync line numbers when user types in live mode
  if (mode !== "live") return;
  const lines = getCurrentCode().split("\n");
  document.getElementById("lineNumbers").innerHTML =
    lines.map((_, i) => `<div class="line-num">${i + 1}</div>`).join("");
}

// ─── SYNTAX HIGHLIGHT ────────────────────────────────────────────────────────
function syntaxHL(line) {
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  if (/^\s*\/\//.test(line)) return `<span class="cmt">${esc(line)}</span>`;
  let r = esc(line);
  r = r.replace(/(&quot;.*?&quot;|'.*?'|`.*?`)/g, m => `<span class="str">${m}</span>`);
  ["async","await","function","const","let","var","return","if","else","for",
   "new","this","class","constructor","try","catch","throw","of","in","require"].forEach(kw => {
    r = r.replace(new RegExp(`\\b(${kw})\\b`,"g"), `<span class="kw">$1</span>`);
  });
  r = r.replace(/\b(\d+)\b/g, `<span class="num">$1</span>`);
  r = r.replace(/\b(console|setTimeout|Promise|app|db|res|req|connection)\b/g,
    `<span class="fn">$1</span>`);
  return r;
}

// ─── RESET HELPERS ───────────────────────────────────────────────────────────
function resetIssues() {
  document.getElementById("issuesList").innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">⏳</div>
      <div class="empty-text">Click <strong>Analyze</strong> to detect<br>concurrency bugs.</div>
    </div>`;
  document.getElementById("issueCount").textContent = "0";
  document.getElementById("issueCount").className = "count-badge none";
  document.getElementById("errorBanner").className = "error-banner";
}

function resetExplain() {
  document.getElementById("explainText").innerHTML =
    `<span style="color:var(--text-dim);font-style:italic;">Run analysis to see explanation and knowledge-base references.</span>`;
  document.getElementById("docsUsed").innerHTML = "";
}

// ─── RENDER ISSUES ────────────────────────────────────────────────────────────
function renderIssues(issues) {
  const list  = document.getElementById("issuesList");
  const badge = document.getElementById("issueCount");

  if (!issues || issues.length === 0) {
    badge.textContent = "0";
    badge.className = "count-badge none";
    list.innerHTML = `<div class="empty-state">
      <div class="empty-icon">✓</div>
      <div class="empty-text">No concurrency issues detected.</div>
    </div>`;
    return;
  }

  badge.textContent = issues.length;
  badge.className = "count-badge has";

  list.innerHTML = issues.map(issue => {
    const patternId = issue.pattern_id || issue.pattern || "unknown";
    const sev = issue.severity;
    return `<div class="issue-card ${sev}">
      <div class="issue-top">
        <span class="sev-pill ${sev}">${sev}</span>
        <span style="font-size:11px;color:var(--text-mid);">${escH(patternId)}</span>
        <span class="issue-line">line ${escH(issue.line_range)}</span>
      </div>
      <div class="issue-desc">${escH(issue.description)}</div>
      <div class="issue-fix-label">Fix</div>
      <div class="issue-fix">${escH(issue.fix)}</div>
    </div>`;
  }).join("");
}

function escH(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ─── RENDER EXPLAIN ───────────────────────────────────────────────────────────
function renderExplain(docs, explanation) {
  document.getElementById("explainText").innerHTML = explanation ||
    "<span style='color:var(--text-dim)'>No explanation available.</span>";
  document.getElementById("docsUsed").innerHTML = (docs || [])
    .map(d => `<span class="doc-chip">${escH(d.title || d.id)}</span>`)
    .join("");
}

// ─── BUILD HIGHLIGHTS FROM AI2 RESPONSE ──────────────────────────────────────
function buildHighlightsFromIssues(issues) {
  return issues.map(issue => {
    const cls = issue.severity === "high" ? "hl-high"
              : issue.severity === "medium" ? "hl-med" : "hl-low";
    const range = String(issue.line_range);
    let lines = [];
    if (range.includes("-")) {
      const [a, b] = range.split("-").map(Number);
      for (let i = a; i <= b; i++) lines.push(i);
    } else {
      lines = [parseInt(range)];
    }
    return { hl_lines: lines, hl_cls: cls };
  });
}

// ─── RUN ANALYSIS ─────────────────────────────────────────────────────────────
async function runAnalysis() {
  const btn     = document.getElementById("analyzeBtn");
  const overlay = document.getElementById("loadingOverlay");
  const loadingText = document.getElementById("loadingText");
  const errBanner = document.getElementById("errorBanner");

  btn.disabled = true;
  errBanner.className = "error-banner";
  overlay.classList.add("visible");

  if (mode === "mock") {
    // Simulate AI latency
    loadingText.textContent = "Analyzing concurrency patterns…";
    await sleep(600 + Math.random() * 800);

    const c = MOCK_CASES[currentCaseIdx];
    const resp = c.mock_response;

    overlay.classList.remove("visible");
    renderCodeWithHL(c.code, resp.issues.map(i => ({ hl_lines: i.hl_lines, hl_cls: i.hl_cls })));
    renderIssues(resp.issues);
    renderExplain(resp.docs_used, resp.explanation);
    document.getElementById("cachedBadge").style.display = "none";

  } else {
    // Live mode — call backend → AI2
    loadingText.textContent = "Connecting to AI2 server…";
    const code = getCurrentCode().trim();

    if (!code) {
      overlay.classList.remove("visible");
      btn.disabled = false;
      showError("Code is empty. Paste some JavaScript to analyze.");
      return;
    }

    try {
      loadingText.textContent = "Running RAG pipeline…";
      const r = await fetch(`${BACKEND_URL}/api/analyze`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code, language: "javascript" }),
      });

      const data = await r.json();
      overlay.classList.remove("visible");

      if (!r.ok) {
        showError(data.message || data.detail || `Error ${r.status}`);
        btn.disabled = false;
        return;
      }

      const issues = data.issues || [];
      const hl = buildHighlightsFromIssues(issues);
      renderCodeWithHL(code, hl);
      renderIssues(issues);

      // Build explanation from docs_used (AI2 doesn't return free-text explanation)
      const docs = data.docs_used || [];
      const explainText = issues.length > 0
        ? `AI2 detected <strong>${issues.length} issue${issues.length > 1 ? "s" : ""}</strong> using RAG retrieval from ${docs.length} knowledge-base document${docs.length !== 1 ? "s" : ""}. Review each issue card for details and fixes.`
        : "No concurrency issues detected in this code.";
      renderExplain(docs, explainText);

      // Cached badge
      const cacheBadge = document.getElementById("cachedBadge");
      cacheBadge.style.display = data.cached ? "inline-flex" : "none";

    } catch (err) {
      overlay.classList.remove("visible");
      showError(`Cannot reach backend at ${BACKEND_URL}. Make sure the Express server is running:\n  cd mock-website/backend && node server.js`);
    }
  }

  btn.disabled = false;
}

function showError(msg) {
  const b = document.getElementById("errorBanner");
  b.textContent = msg;
  b.className = "error-banner visible";
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ─── INIT ─────────────────────────────────────────────────────────────────────
loadCase(0);
checkHealth();
setInterval(checkHealth, 15000); // recheck every 15s
</script>
